services:
  ollama:
    image: ollama/ollama:0.22.0
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11433:11434"
    
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve & 
       sleep 5 && 
       ollama pull llama3.2:3b && 
       ollama pull mistral &&
       wait"

    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.30.0-alpine
    container_name: nginx
    ports:
      - "127.0.0.1:11435:11435"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro 
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-data: